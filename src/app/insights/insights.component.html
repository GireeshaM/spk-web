<div class="it-container position-relative">
  <img
    [src]="isMobile ? smallImage : heroImage"
    class="img-fluid hero-image"
    alt="Hero Image"
  />
  <div class="d-flex align-items-center justify-content-end w-100 h-100">
    <div
      class="text-container p-4 text-white"
      [ngClass]="{
        'text-right': alignRight,
      }"
    >
      <h1 class="display-3 fw-bold text-white">{{ whatHeader }}</h1>
    </div>
  </div>
</div>

<div class="container px-5 mt-5 mb-5">
  <div class="row row-cols-1 row-cols-md-2 g-4 px-5">
    <div class="col" *ngFor="let card of cards">
      <div class="card h-100">
        <a [routerLink]="card.link" [queryParams]="{ section: card.section }">
          <img
            [src]="card.imageUrl"
            class="card-img-top border-bottom"
            alt="Card image"
        /></a>
        <div class="card-body d-flex align-items-center">
          <h6 class="card-text fw-bold">
            {{ card.text }}
          </h6>
        </div>
      </div>
    </div>
  </div>
</div>
