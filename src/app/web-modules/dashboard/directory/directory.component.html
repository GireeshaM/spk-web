<app-dashboard-header></app-dashboard-header>

<div class="container p-3 mt-5">
  <div class="row">
    <div class="col-md-3 col-sm-6 mb-4" *ngFor="let employee of employeeData">
      <div class="card shadow-sm border text-center p-3">
        <img
          src="assets/dashboard/image.png"
          alt="Profile Picture"
          class="rounded-circle mx-auto"
          width="80"
          height="80"
          style="object-fit: cover"
        />
        <h6 class="mt-3 mb-1 fw-bold">{{ employee.full_name }}</h6>
        <p class="text-muted mb-2">{{ employee.designation }}</p>
        <p class="text-muted mb-0">
          <i class="fa fa-envelope me-2"></i>{{ employee.email }}
        </p>
      </div>
    </div>
  </div>
</div>
