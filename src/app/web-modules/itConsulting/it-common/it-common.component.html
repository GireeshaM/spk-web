<div>
  <div class="container">
    <div class="title text-center">
      <div *ngFor="let card of data; let i = index" class="mb-3">
        <ng-container *ngIf="i % 2 === 0; else oddTemplate">
          <ng-container *ngTemplateOutlet="evenTemplate"></ng-container>
        </ng-container>
        <ng-template #oddTemplate>
          <div class="card mb-3">
            <div class="row g-0">
              <div class="col-12 col-md-6 order-md-1">
                <img
                  class="card-img-top img-fluid w-100"
                  [src]="card.image"
                  alt="image"
                  style="max-height: 300px; object-fit: cover"
                />
              </div>
              <div class="col-12 col-md-6 d-flex align-items-center order-md-2">
                <div class="p-3 p-md-4">
                  <h3 class="card-title">{{ card.title }}</h3>
                  <p
                    class="card-text"
                    [innerHTML]="formatText(card.description)"
                  ></p>
                </div>
              </div>
            </div>
          </div>
        </ng-template>

        <ng-template #evenTemplate>
          <div class="card mb-3">
            <div class="row g-0">
              <div class="col-12 col-md-6 order-md-2">
                <img
                  class="card-img-top img-fluid w-100"
                  [src]="card.image"
                  alt="image"
                  style="max-height: 300px; object-fit: cover"
                />
              </div>
              <div class="col-12 col-md-6 d-flex align-items-center order-md-1">
                <div class="p-3 p-md-4">
                  <h3 class="card-title">{{ card.title }}</h3>
                  <p
                    class="card-text"
                    [innerHTML]="formatText(card.description)"
                  ></p>
                </div>
              </div>
            </div>
          </div>
        </ng-template>
      </div>
    </div>
  </div>
</div>
