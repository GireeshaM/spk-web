<div class="container mb-4 whatwedo">
  <div class="text-center mb-4">
    <h1>What we do</h1>
    <h5>{{ whatHeader }}</h5>
  </div>

  <p-carousel
    [value]="whatList"
    [numVisible]="3"
    [numScroll]="1"
    [circular]="true"
    [responsiveOptions]="responsiveOptions"
    [autoplayInterval]="5000"
  >
    <ng-template let-data pTemplate="item">
      <div class="carousel-item">
        <div class="card">
          <img [src]="data.image" class="card-img-top" alt="Image" />
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">{{ data.title }}</h5>
            <p class="card-text">{{ data.description }}</p>
            <div class="mt-auto">
              <a
                routerLink="{{ data.link }}"
                class="text-black text-decoration-none btnn btn me-1"
                >{{ data.btn }}
                <i
                  class="fa fa-chevron-right ms-2 custom-icon"
                  aria-hidden="true"
                ></i
              ></a>
            </div>
          </div>
        </div>
      </div>
    </ng-template>
  </p-carousel>
</div>
