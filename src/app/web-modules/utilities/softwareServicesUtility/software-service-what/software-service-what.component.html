<div class="what">
  <div class="container mt-5" [ngClass]="{ 'two-per-row': isTwoPerRow }">
    <div class="text-center mb-5">
      <h1>{{ whatWeDo }}</h1>
      <h5>{{ whatContent }}</h5>
    </div>
    <div class="row justify-content-center">
      <ng-container *ngFor="let card of cards; let i = index">
        <div class="col-12 col-sm-6 col-md-4 mb-4 d-flex align-items-stretch">
          <div class="card border-0 bg-transparent">
            <div class="horizontal-line"></div>
            <div class="card-body">
              <h5 class="card-title">
                <strong>{{ card.title }}</strong>
              </h5>
              <p class="card-text">{{ card.text }}</p>
            </div>
          </div>
        </div>
        <!-- New row after every 2 cards if two-per-row -->
        <div
          *ngIf="isTwoPerRow && i % 2 === 1 && i < cards.length - 1"
          class="w-100 mt-4"
        ></div>
      </ng-container>
    </div>
    <div class="text-center mt-5">
      <a
        href="/contactUs"
        class="text-black text-decoration-none btn me-1 btnn mb-5"
        >Request a meeting
        <i class="fa fa-chevron-right ms-2 custom-icon" aria-hidden="true"></i>
      </a>
    </div>
  </div>
</div>
