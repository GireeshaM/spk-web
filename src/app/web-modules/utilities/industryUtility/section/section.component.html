<div [ngClass]="{ 'two-per-row': isTwoPerRow }" class="tele">
  <div
    class="container-fluid topSection h-100"
    [ngStyle]="{ 'background-image': 'url(' + headerBgImg + ')' }"
  >
    <div class="row d-flex flex-column flex-md-row align-items-center">
      <div
        class="p-5 text-start col-12 col-md-7 justify-content-center align-items-center"
      >
        <h1 class="text-white px-5 mb-4">{{ itHeader }}</h1>
        <p class="text-white px-5">{{ itContent }}</p>
      </div>
    </div>
  </div>
  <div class="container-fluid d-block d-md-none smallScreenSection">
    <img [src]="industryImg" class="img-fluid" alt="Industry Image" />
    <div class="text-center" style="background-color: #0a2250">
      <h1 class="text-white px-5 mb-3 pt-3">{{ itHeader }}</h1>
      <p class="text-white px-5">{{ itContent }}</p>
    </div>
  </div>
  <div class="industryBg">
    <div class="container p-5 bottomSection mb-5">
      <h1 class="text-center mb-5">
        <strong>How can we help</strong>
      </h1>
      <div class="row justify-content-center">
        <ng-container *ngFor="let card of cards; let i = index">
          <div
            class="col-12 col-md-6 col-lg-4 p-2 d-flex justify-content-center align-items-center"
          >
            <div class="card h-100 text-start" [ngClass]="getCardClass(i)">
              <div class="card-body d-flex flex-column p-4 mt-3 ms-3">
                <h4 class="card-title mt-5">{{ card.title }}</h4>
                <p>{{ card.description }}</p>
                <a
                  href="{{ card.link }}"
                  class="text-decoration-none btn me-1 btnn"
                  >More
                  <i class="fa fa-long-arrow-right mx-2" aria-hidden="true"></i>
                </a>
              </div>
            </div>
          </div>

          <!-- New row after every 3 cards if not two-per-row, or after every 2 cards if two-per-row -->
          <div
            *ngIf="
              (isTwoPerRow && i % 2 === 1) ||
              (!isTwoPerRow && i % 3 === 2 && i < cards.length - 1)
            "
            class="w-100 mt-4"
          ></div>
        </ng-container>
      </div>
    </div>
  </div>
</div>
